    <meta charset="UTF-8" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="format-detection" content="telephone=no" />

    <meta
      name="description"
      content="Multimodal live opera & musical theatre plot companion, 3D stage & interval route visualiser, MongoDB Atlas hybrid search & London Tube civic map, and Saint AI autonomous event agent."
    />
    <meta property="og:title" content="sottovoce — Live Opera & Theatre Companion + London Civic Map" />
    <meta
      property="og:description"
      content="Under the voice, under the ground: live libretto subtext, 3D stage blocking, Lyria leitmotif stems, MongoDB Atlas Hybrid Search, and Saint AI event ingestion."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#08080B] text-[#F4F0EA] antialiased selection:bg-[#D4AF37]/30 selection:text-[#F5E6B3]">
    <div id="root"></div>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('sottovoce-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
